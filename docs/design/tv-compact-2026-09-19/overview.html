<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AudioSwitcher TV — полный набор экранов</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: radial-gradient(1000px 700px at 84% 5%, #282e36, #0d1014 72%); color: #f2f4f7; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; }
    main { width: 1920px; height: 1080px; padding: 44px 58px; }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
    header p { margin: 0; color: #bcc3cf; font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    figure { margin: 0; }
    .frame { background: #191c21; border-radius: 9px; padding: 5px; box-shadow: 0 5px 12px rgba(0,0,0,.22); }
    img { display: block; width: 100%; height: auto; border-radius: 5px; }
    figcaption { color: #bcc3cf; font-size: 15px; margin-top: 7px; }
  </style>
</head>
<body>
  <main>
    <header><h1>Компактная ТВ-версия · полный набор</h1><p>12 состояний · 1920×1080</p></header>
    <section class="grid">
      <figure><div class="frame"><img src="01-control.png" alt="Управление"></div><figcaption>01 · Управление</figcaption></figure>
      <figure><div class="frame"><img src="02-running.png" alt="Запущенные"></div><figcaption>02 · Запущенные</figcaption></figure>
      <figure><div class="frame"><img src="03-launch.png" alt="Для запуска"></div><figcaption>03 · Для запуска</figcaption></figure>
      <figure><div class="frame"><img src="04-audio-picker.png" alt="Выбор звука"></div><figcaption>04 · Выбор звука</figcaption></figure>
      <figure><div class="frame"><img src="05-settings.png" alt="Настройки"></div><figcaption>05 · Настройки</figcaption></figure>
      <figure><div class="frame"><img src="06-display-picker.png" alt="Выбор монитора"></div><figcaption>06 · Выбор монитора</figcaption></figure>
      <figure><div class="frame"><img src="07-window-picker.png" alt="Выбор окна"></div><figcaption>07 · Выбор окна</figcaption></figure>
      <figure><div class="frame"><img src="08-editor.png" alt="Редактор"></div><figcaption>08 · Редактор записи</figcaption></figure>
      <figure><div class="frame"><img src="09-confirm-close.png" alt="Закрытие"></div><figcaption>09 · Подтверждение закрытия</figcaption></figure>
      <figure><div class="frame"><img src="10-confirm-delete.png" alt="Удаление"></div><figcaption>10 · Подтверждение удаления</figcaption></figure>
      <figure><div class="frame"><img src="11-error.png" alt="Ошибка"></div><figcaption>11 · Ошибка</figcaption></figure>
      <figure><div class="frame"><img src="12-empty-catalogue.png" alt="Пустой каталог"></div><figcaption>12 · Пустой каталог</figcaption></figure>
    </section>
  </main>
</body>
</html>
